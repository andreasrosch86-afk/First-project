<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>First Project</title>
  <style>
    :root {
      --bg: #f7f7f5;
      --text: #1a1a1a;
      --muted: #666;
      --accent: #0070f3;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #111;
        --text: #eee;
        --muted: #999;
        --accent: #3291ff;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 16px;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      line-height: 1.5;
    }
    main { max-width: 560px; text-align: center; }
    h1 { font-size: clamp(2rem, 6vw, 3rem); margin: 0 0 0.5rem; }
    p { color: var(--muted); margin: 0 0 1.5rem; }
    a {
      color: var(--accent);
      text-decoration: none;
      font-weight: 600;
    }
    a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <main>
    <h1>Hello, world 👋</h1>
    <p>This is my first project, deployed with Vercel from GitHub.</p>
    <a href="https://github.com/andreasrosch86-afk/First-project">View the code on GitHub →</a>
  </main>
</body>
</html>
